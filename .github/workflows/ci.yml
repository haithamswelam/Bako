name: Bako CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - "K8s/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
        

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Backend import check
        run: |
          python -m compileall app

  frontend-ci:
    name : frontend ci
    runs-on : ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Lint frontend
        run: npm run lint

      - name: Run frontend tests
        run: npm run test

  build-and-push:
    name: Build and Push Images
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    permissions:
      id-token: write
      contents: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::483272865934:role/bako-github-actions-ecr-role
              #aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
              #aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1
          role-skip-session-tagging: true

      - name: Check if backend image exists
        id: check_backend
        run: |
          if OUT=$(aws ecr describe-images --repository-name bako-backend \
               --image-ids imageTag=${{ github.sha }} 2>&1); then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif echo "$OUT" | grep -q ImageNotFoundException; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "$OUT"; exit 1
          fi

      - name: Check if frontend image exists
        id: check_frontend
        run: |
          if OUT=$(aws ecr describe-images --repository-name bako-frontend \
               --image-ids imageTag=${{ github.sha }} 2>&1); then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif echo "$OUT" | grep -q ImageNotFoundException; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "$OUT"; exit 1
          fi

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend image
        if: steps.check_backend.outputs.exists == 'false'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -f Dockerfile -t $ECR_REGISTRY/bako-backend:$IMAGE_TAG .
          docker push $ECR_REGISTRY/bako-backend:$IMAGE_TAG

      - name: Build and push frontend image
        if: steps.check_frontend.outputs.exists == 'false'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        working-directory: frontend
        run: |
          docker build -f Dockerfile.prod -t $ECR_REGISTRY/bako-frontend:$IMAGE_TAG .
          docker push $ECR_REGISTRY/bako-frontend:$IMAGE_TAG

      - name: Open PR to update image tags in K8s/
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          BRANCH="deploy/image-${IMAGE_TAG::7}-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          sed -i "s#\(bako-backend:\).*#\1${IMAGE_TAG}#" K8s/backend-deployment.yaml
          sed -i "s#\(bako-frontend:\).*#\1${IMAGE_TAG}#" K8s/frontend-deployment.yaml
          git add K8s/backend-deployment.yaml K8s/frontend-deployment.yaml
          git commit -m "chore: deploy images ${IMAGE_TAG::7}"
          git push origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "Deploy images ${IMAGE_TAG::7}" \
            --body "Automated: update bako-backend and bako-frontend image tags to ${IMAGE_TAG}."
