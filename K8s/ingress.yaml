# The public door: one ALB in the public subnets, sending everything to the frontend.
# The frontend's nginx already forwards /api to the backend, so one rule is enough.
# The AWS Load Balancer Controller (installed by bootstrap-cluster.sh) reads this object and builds the ALB.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bako
  namespace: bako
  annotations:
    # internet-facing = reachable from your phone without a VPN
    alb.ingress.kubernetes.io/scheme: internet-facing
    # ip = the ALB talks straight to the pod addresses (VPC CNI gives pods real VPC IPs)
    alb.ingress.kubernetes.io/target-type: ip
    # Step 2: HTTPS. Port 80 stays open only to answer with a redirect to 443; the certificate does the encryption.
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    # Certificate made by infra-Bako-persistent (README step D). START refuses to run if this ever holds the placeholder word again.
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:eu-north-1:483272865934:certificate/d1be517a-c3d5-4c7e-b848-83c388c9c1b7
    # Modern TLS only (TLS 1.2 and 1.3)
    alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS13-1-2-2021-06
    # ExternalDNS reads this and writes bako.awsbako.site -> the new ALB into Route 53 after every Start
    external-dns.alpha.kubernetes.io/hostname: bako.awsbako.site
    # Who may connect. 0.0.0.0/0 = everyone. To allow only yourself, put your own address here, for example 203.0.113.7/32
    alb.ingress.kubernetes.io/inbound-cidrs: 0.0.0.0/0
    # The ALB marks a pod healthy when this path answers 200 (the frontend serves its homepage at /)
    alb.ingress.kubernetes.io/healthcheck-path: /
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "15"
    alb.ingress.kubernetes.io/healthy-threshold-count: "2"
    alb.ingress.kubernetes.io/success-codes: "200"
    # Pods that are being replaced stop receiving traffic after 30 s instead of the default 300 s
    alb.ingress.kubernetes.io/target-group-attributes: deregistration_delay.timeout_seconds=30
    # Monitoring: the ALB writes one line per request to our permanent bucket (every ~5 min). The logs outlive the nightly destroy.
    alb.ingress.kubernetes.io/load-balancer-attributes: access_logs.s3.enabled=true,access_logs.s3.bucket=bako-ops-483272865934-eu-north-1,access_logs.s3.prefix=alb-logs
    # Tags on the AWS resources, to find them in the console and in the bill
    alb.ingress.kubernetes.io/tags: Project=bako,Environment=lab
spec:
  ingressClassName: alb
  rules:
    - host: bako.awsbako.site
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: bako-frontend-service
                port:
                  number: 80
